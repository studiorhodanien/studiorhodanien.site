<!-- LOADER ANIMATION - À inclure en haut du <body> de index.html -->

<div class="loader-screen" id="loaderScreen">
  <svg class="signature-svg" viewBox="0 0 600 100" preserveAspectRatio="xMidYMid meet">
    <!-- Texte "Studio Rhôdanien" en tant que path -->
    <!-- Utilisation d'une font manuscrite (Great Vibes via Google Fonts) -->
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
      </style>
    </defs>

    <!-- Chemin SVG du texte "Studio Rhôdanien" -->
    <!-- Ce path est généré par conversion de la fonte manuscrite -->
    <g id="signaturePath">
      <text
        x="50%"
        y="55%"
        font-family="Great Vibes"
        font-size="72"
        fill="none"
        stroke="#C98C49"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        text-anchor="middle"
        dominant-baseline="middle"
        class="signature-text">
        Studio Rhôdanien
      </text>
    </g>
  </svg>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

  /* Loader Screen */
  .loader-screen {
    position: fixed;
    inset: 0;
    background: #4B0F1E;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    overflow: hidden;
  }

  .signature-svg {
    width: 100%;
    max-width: 600px;
    height: auto;
  }

  .signature-text {
    animation: writeSignature 2s ease-in-out forwards;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
  }

  /* Animation d'écriture du texte */
  @keyframes writeSignature {
    0% {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      opacity: 1;
    }
    85% {
      stroke-dasharray: 1000;
      stroke-dashoffset: 0;
      fill: none;
      opacity: 1;
    }
    100% {
      stroke-dasharray: 1000;
      stroke-dashoffset: 0;
      fill: #C98C49;
      opacity: 1;
    }
  }

  /* Animation de sortie du loader */
  @keyframes loaderExit {
    0% {
      transform: translateY(0);
      opacity: 1;
    }
    100% {
      transform: translateY(-100%);
      opacity: 0;
    }
  }

  .loader-screen.exit {
    animation: loaderExit 0.8s cubic-bezier(0.76, 0, 0.24, 1) forwards;
  }

  /* Bloquer le scroll pendant le loader */
  body.loader-active {
    overflow: hidden;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const loaderScreen = document.getElementById('loaderScreen');

    if (!loaderScreen) return;

    // Bloquer le scroll
    document.body.classList.add('loader-active');

    // Durée totale : animation d'écriture (2s) + pause (0.5s) + sortie (0.8s)
    const totalDuration = 2000 + 500 + 800;

    // Retirer le loader après le délai
    setTimeout(() => {
      loaderScreen.classList.add('exit');

      // Retirer du DOM après l'animation de sortie
      setTimeout(() => {
        loaderScreen.remove();
        document.body.classList.remove('loader-active');
      }, 800);
    }, 2500); // 2s (écriture) + 0.5s (pause)

    // Option skip : clic ou scroll pendant le loader
    function skipLoader() {
      clearTimeout(skipTimeout);
      loaderScreen.classList.add('exit');
      setTimeout(() => {
        loaderScreen.remove();
        document.body.classList.remove('loader-active');
      }, 800);
    }

    // Skip au clic
    document.addEventListener('click', skipLoader, { once: true });

    // Skip au scroll
    document.addEventListener('wheel', skipLoader, { once: true });
    document.addEventListener('touchmove', skipLoader, { once: true });
  });
</script>
