<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- S Stylisé avec flèche -->
  <g>
    <!-- Couleur bordeaux #4B0F1E -->
    <path d="M 150 80 Q 120 80 120 110 Q 120 135 150 135 L 200 135 Q 230 135 230 110"
          fill="none" stroke="#4B0F1E" stroke-width="20" stroke-linecap="round"/>

    <!-- Couleur or #C98C49 (accent) -->
    <path d="M 200 135 Q 250 135 270 100 L 310 50"
          fill="none" stroke="#C98C49" stroke-width="18" stroke-linecap="round"/>

    <!-- Flèche pointe -->
    <path d="M 310 50 L 290 70 M 310 50 L 330 60"
          stroke="#C98C49" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Texte "Studio Rhôdanien" -->
  <text x="380" y="120" font-family="Great Vibes, cursive" font-size="80" fill="#4B0F1E" font-weight="700">
    Studio Rhôdanien
  </text>

  <!-- Sous-titre -->
  <text x="380" y="155" font-family="Inter, sans-serif" font-size="18" fill="#0A575D" letter-spacing="3" text-transform="uppercase">
    Web Design • Vienne, France
  </text>
</svg>